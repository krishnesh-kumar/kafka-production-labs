# Lab 01 - Kafka platform: 3-broker KRaft cluster, Kafka UI, Prometheus + Grafana.
# From the repo root (Docker or Podman):  ./labs.sh up 01 && ./labs.sh drill 01 && ./labs.sh down 01
# Or in this directory:  docker compose up -d --wait   (or: podman compose up -d --wait)
# Images are fully qualified because Podman does not guess a registry for short names.

name: lab01

x-kafka-common: &kafka-common
  image: docker.io/apache/kafka:3.9.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 20s
    retries: 18
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
  # Production-style defaults: every topic survives one broker loss without losing acks=all writes.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    container_name: lab01-kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092"

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    container_name: lab01-kafka-2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094"

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    container_name: lab01-kafka-3
    ports: ["9096:9096"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9096"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:19092,EXTERNAL://localhost:9096"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    container_name: lab01-kafka-ui
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: lab01
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

  kafka-exporter:
    image: docker.io/danielqsj/kafka-exporter:v1.8.0
    container_name: lab01-kafka-exporter
    restart: unless-stopped
    command:
      - "--kafka.server=kafka-1:19092"
      - "--kafka.server=kafka-2:19092"
      - "--kafka.server=kafka-3:19092"
      - "--topic.filter=^[^_].*"
      - "--group.filter=.*"
    ports: ["9308:9308"]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: lab01-prometheus
    ports: ["9090:9090"]
    volumes:
      # ":z" relabels the files for SELinux hosts (Fedora, RHEL, Podman on Linux); elsewhere it is a no-op.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,z

  grafana:
    image: docker.io/grafana/grafana:11.3.1
    container_name: lab01-grafana
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on: [prometheus]
