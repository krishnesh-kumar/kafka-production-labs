# Lab 03 - Kafka Streams: sliding-window failure-rate alerting per merchant, with latching raise/clear.
# From the repo root (Docker or Podman):  ./labs.sh up 03 && ./labs.sh drill 03 && ./labs.sh down 03
# Or in this directory:  docker compose up -d --build && ./scripts/run-demo.sh
# Images are fully qualified because Podman does not guess a registry for short names.

name: lab03

services:
  kafka:
    image: docker.io/apache/kafka:3.9.1
    container_name: lab03-kafka
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: "bGFiMDMtc3RyZWFtcy1hbA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 18
      start_period: 15s

  init-topics:
    image: docker.io/apache/kafka:3.9.1
    container_name: lab03-init-topics
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    # payments has ONE partition on purpose: the generator writes 14 simulated minutes in a few seconds.
    # With several input partitions, the Streams tasks drain that backlog at different speeds, the
    # repartition topic interleaves them out of event-time order, and a lagging merchant's payments
    # arrive more than the 30 s grace behind stream time and are dropped. See the README.
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic payments --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic merchant-alerts --partitions 3 --replication-factor 1

  alerting:
    build: ./app
    container_name: lab03-alerting
    environment:
      BOOTSTRAP_SERVERS: "kafka:19092"
    depends_on:
      init-topics: { condition: service_completed_successfully }

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    container_name: lab03-kafka-ui
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: lab03
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:19092"
    depends_on:
      kafka: { condition: service_healthy }

  generator:
    image: docker.io/library/python:3.12-slim
    container_name: lab03-generator
    profiles: ["demo"]
    environment:
      BOOTSTRAP_SERVERS: "kafka:19092"
    volumes:
      # ":z" relabels the directory for SELinux hosts (Fedora, RHEL, Podman on Linux); elsewhere a no-op.
      - ./generator:/generator:ro,z
    depends_on:
      init-topics: { condition: service_completed_successfully }
    entrypoint: ["/bin/sh", "-c", "pip install -q --root-user-action=ignore --disable-pip-version-check confluent-kafka==2.6.1 && python /generator/generate.py"]
