name: labs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly, so image drift is caught early

# Each demo step tees its output to /tmp/<job>.log and records its tail as a notice annotation when it
# passes. On failure, the tail of that log,
# `docker compose ps` and recent container logs are re-emitted as error annotations, so a red run
# can be diagnosed from the check-run annotations alone.

jobs:
  health-check-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: labs/04-health-check } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  lab01-platform-and-health-check:
    runs-on: ubuntu-latest
    env:
      LOG: /tmp/lab01.log
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Start 3-broker cluster, UI, Prometheus, Grafana
        working-directory: labs/01-kafka-platform
        run: |
          echo "### compose up" >> "$LOG"
          docker compose up -d --quiet-pull --wait --wait-timeout 300 2>&1 | tee -a "$LOG"
      - name: Failure drill
        working-directory: labs/01-kafka-platform
        run: |
          echo "### failure drill" >> "$LOG"
          ./scripts/failure-drill.sh 2>&1 | tee -a "$LOG"
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --level notice --title "lab01 drill passed" --log "$LOG" --lines 45
      - name: Prometheus sees all 3 brokers
        run: |
          echo "### prometheus" >> "$LOG"
          for i in $(seq 1 30); do
            v=$(curl -s 'http://localhost:9090/api/v1/query?query=kafka_brokers' | python3 -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else 0)')
            echo "kafka_brokers=$v" | tee -a "$LOG"; [ "$v" = "3" ] && exit 0; sleep 5
          done; exit 1
      - name: Grafana dashboard provisioned
        run: |
          echo "### grafana" >> "$LOG"
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/dashboards/uid/kafka-health > /dev/null && { echo ok; exit 0; }; sleep 3
          done; curl -s http://localhost:3000/api/dashboards/uid/kafka-health 2>&1 | tee -a "$LOG"; exit 1
      - name: Seed misconfigurations and run the health check
        working-directory: labs/04-health-check
        run: |
          echo "### health check" >> "$LOG"
          {
            pip install -q -r requirements.txt
            ./scripts/seed-demo-cluster.sh
            python -m healthcheck --bootstrap localhost:9092 --out sample-report.md
          } 2>&1 | tee -a "$LOG"
          cat sample-report.md >> "$GITHUB_STEP_SUMMARY"
          grep -q "min.insync.replicas equals the replication factor" sample-report.md
          grep -q "replication factor 1" sample-report.md
          grep -q "no active members" sample-report.md
      - uses: actions/upload-artifact@v5
        with: { name: sample-report, path: labs/04-health-check/sample-report.md }
      - name: Annotate failure (step output)
        if: failure()
        working-directory: labs/01-kafka-platform
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --title lab01 --log "$LOG" --lines 80 --ps
      - name: Annotate failure (container logs)
        if: failure()
        working-directory: labs/01-kafka-platform
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --title lab01 --services kafka-1 kafka-2 kafka-3 kafka-exporter prometheus
      - name: Logs on failure
        if: failure()
        working-directory: labs/01-kafka-platform
        run: docker compose logs --tail 80

  lab02-debezium-cdc:
    runs-on: ubuntu-latest
    env:
      LOG: /tmp/lab02.log
    defaults: { run: { shell: bash, working-directory: labs/02-debezium-cdc } }
    steps:
      - uses: actions/checkout@v5
      - name: Start Kafka, PostgreSQL, Kafka Connect, Kafka UI
        run: |
          echo "### compose up" >> "$LOG"
          docker compose up -d --quiet-pull --wait --wait-timeout 300 2>&1 | tee -a "$LOG"
      - name: Register connectors
        run: |
          echo "### register connectors" >> "$LOG"
          ./scripts/register-connectors.sh 2>&1 | tee -a "$LOG"
      - name: Run ./scripts/cdc-demo.sh
        run: |
          echo "### cdc demo" >> "$LOG"
          ./scripts/cdc-demo.sh 2>&1 | tee -a "$LOG"
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --level notice --title "lab02 demo passed" --log "$LOG" --lines 45
      - name: Annotate failure (step output)
        if: failure()
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --title lab02 --log "$LOG" --lines 80 --ps
          curl -s http://localhost:8083/connectors?expand=status > /tmp/connect-status.json || true
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --title "lab02 connector status" --log /tmp/connect-status.json --lines 40
      - name: Annotate failure (container logs)
        if: failure()
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --title lab02 --services kafka postgres connect
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 120

  lab03-streams-alerting:
    runs-on: ubuntu-latest
    env:
      LOG: /tmp/lab03.log
    defaults: { run: { shell: bash, working-directory: labs/03-streams-alerting } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Unit tests (TopologyTestDriver)
        run: mvn -B -f app/pom.xml verify
      - name: Start Kafka and the Streams app
        run: |
          echo "### compose up" >> "$LOG"
          docker compose --profile demo pull -q kafka init-topics kafka-ui generator
          docker compose up -d --build 2>&1 | tail -40 | tee -a "$LOG"
      - name: End-to-end demo
        run: |
          echo "### run demo" >> "$LOG"
          ./scripts/run-demo.sh 2>&1 | tee -a "$LOG"
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --level notice --title "lab03 demo passed" --log "$LOG" --lines 25
      - name: Annotate failure (step output)
        if: failure()
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --title lab03 --log "$LOG" --lines 80 --ps
          K="docker exec lab03-kafka /opt/kafka/bin"
          {
            echo "## topics"; $K/kafka-topics.sh --bootstrap-server localhost:19092 --list
            echo "## end offsets"; $K/kafka-get-offsets.sh --bootstrap-server localhost:19092 --time -1
            echo "## payment-alerting group"; $K/kafka-consumer-groups.sh --bootstrap-server localhost:19092 --describe --group payment-alerting
          } > /tmp/lab03-diag.log 2>&1 || true
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --title "lab03 cluster state" --log /tmp/lab03-diag.log --lines 120
      - name: Annotate failure (container logs)
        if: failure()
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/annotate.py" --title lab03 --services kafka init-topics alerting
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 120
